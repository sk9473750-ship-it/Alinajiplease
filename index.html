<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>AlinajiPlease</title>
<style>
:root{--pink:#ffd9e8;--card:#fffafd;--ink:#26212b;--green:#61d7a0;--red:#ef5368;--soft:#f8b7ca;--shadow:#d7a8ba}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:var(--ink);background:var(--pink)}
body{overflow-x:hidden}.app{min-height:100vh;display:grid;place-items:center;padding:20px 12px;position:relative;overflow:hidden}
.bgstar{position:fixed;font-size:22px;opacity:.55;animation:float 4s ease-in-out infinite;pointer-events:none}.s1{left:8%;top:13%}.s2{right:10%;top:24%;animation-delay:1s}.s3{left:14%;bottom:17%;animation-delay:2s}.s4{right:13%;bottom:11%;animation-delay:3s}
.screen{width:min(720px,100%);position:relative}.panel{background:rgba(255,250,253,.97);border:4px solid #302b35;border-radius:34px;box-shadow:0 12px 0 var(--shadow),0 22px 50px rgba(75,35,55,.12);padding:28px 22px;min-height:650px;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;overflow:hidden}
.back{position:absolute;left:15px;top:14px;border:3px solid #302b35;background:#fff;border-radius:16px;padding:8px 13px;font-weight:900;font-size:15px;cursor:pointer;z-index:4;box-shadow:0 4px 0 #302b35}.back:active{transform:translateY(3px);box-shadow:0 1px 0 #302b35}
.brand{font-weight:1000;font-size:clamp(28px,7vw,48px);margin-bottom:18px;letter-spacing:-1.5px}.small{font-weight:800;opacity:.7}.introText{text-align:center;font-size:clamp(25px,6vw,42px);font-weight:950;line-height:1.12;margin:25px 5px}.introSub{font-size:17px;font-weight:800;opacity:.7;margin-bottom:28px;text-align:center}
.btn{border:0;border-radius:20px;padding:14px 22px;font-weight:950;font-size:18px;cursor:pointer;box-shadow:0 6px 0 rgba(38,33,43,.22);transition:.18s;user-select:none}.btn:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(38,33,43,.22)}.green{background:var(--green)}.pinkbtn{background:#f6a9c1}.whitebtn{background:white;border:3px solid #302b35}.redbtn{background:var(--red);color:white}
.doodleWrap{width:min(360px,86vw);height:220px;display:grid;place-items:center;margin:4px auto 12px;background:#ffeaf2;border-radius:26px;border:2px dashed #efabc2;overflow:hidden;position:relative}.doodle{width:300px;image-rendering:auto;mix-blend-mode:normal}.doodleLabel{position:absolute;bottom:8px;font-size:11px;font-weight:900;opacity:.35}
.message{font-size:clamp(20px,5vw,31px);font-weight:950;text-align:center;line-height:1.2;max-width:620px;min-height:105px;display:grid;place-items:center;padding:0 8px}.actions{display:flex;align-items:center;justify-content:center;gap:15px;margin-top:12px;min-height:100px;width:100%;position:relative}.yes{background:var(--green);min-width:120px;min-height:58px;font-size:25px;padding:10px 24px;transform-origin:center;transition:transform .35s cubic-bezier(.2,1.7,.35,1)}.no{background:var(--red);color:white;min-width:70px;min-height:42px;font-size:17px}.dead{cursor:default!important;opacity:.95}.progressDots{display:flex;gap:8px;margin-top:20px}.dot{width:11px;height:11px;border-radius:50%;background:#df9eb6}.dot.on{background:#4dcc8e;transform:scale(1.25)}
/* intro doodle made with CSS */
.waveDoodle{width:210px;height:210px;position:relative;animation:bob 1.6s ease-in-out infinite}.head{position:absolute;left:56px;top:25px;width:100px;height:92px;border:8px solid #2d2932;border-radius:48% 48% 45% 45%;background:white}.eye{position:absolute;top:37px;width:13px;height:13px;background:#2d2932;border-radius:50%}.e1{left:22px}.e2{right:22px}.mouth{position:absolute;left:38px;top:61px;width:25px;height:13px;border-bottom:7px solid #2d2932;border-radius:0 0 20px 20px}.body{position:absolute;left:76px;top:112px;width:60px;height:67px;background:white;border:7px solid #2d2932;border-radius:18px 18px 25px 25px}.arm{position:absolute;width:60px;height:9px;background:#2d2932;border-radius:9px;top:127px}.a1{left:27px;transform:rotate(25deg)}.a2{right:27px;transform:rotate(-25deg);animation:waveArm .8s ease-in-out infinite}.leg{position:absolute;width:9px;height:42px;background:#2d2932;border-radius:8px;top:169px}.l1{left:88px;transform:rotate(8deg)}.l2{right:88px;transform:rotate(-8deg)}
/* meter */
.meterTitle{font-size:clamp(30px,7vw,48px);font-weight:1000;margin-bottom:8px}.meterSub{font-size:20px;font-weight:900;text-align:center;margin-bottom:26px}.meterBox{width:min(560px,92%);background:#f2d9e3;border:4px solid #302b35;border-radius:28px;padding:9px;box-shadow:inset 0 2px 0 white}.meterFill{height:34px;width:0;background:linear-gradient(90deg,#68dca8,#ffd25f,#ef5368);border-radius:18px;transition:width 3s cubic-bezier(.2,.8,.2,1)}.meterPercent{font-size:48px;font-weight:1000;margin:18px 0 4px}.meterStatus{font-size:18px;font-weight:900;min-height:28px}.meterTick{font-size:42px;margin:18px;animation:pulse 1s infinite}.next{margin-top:22px;opacity:.45;pointer-events:none}.next.ready{opacity:1;pointer-events:auto}
/* gifts */
.giftsTitle{font-size:clamp(30px,7vw,48px);font-weight:1000;text-align:center}.giftsSub{font-weight:850;text-align:center;opacity:.72;margin-bottom:22px}.giftGrid{display:grid;grid-template-columns:1fr;gap:16px;width:min(600px,100%)}.giftCard{background:#fff;border:3px solid #302b35;border-radius:25px;padding:17px;display:flex;align-items:center;gap:15px;cursor:pointer;box-shadow:0 7px 0 #e2b6c8;transition:.2s;text-align:left}.giftCard:hover{transform:translateY(-3px)}.giftIcon{font-size:50px;filter:drop-shadow(0 5px 2px #e3b1c4);animation:giftFloat 2s ease-in-out infinite}.giftCard:nth-child(2) .giftIcon{animation-delay:.3s}.giftCard:nth-child(3) .giftIcon{animation-delay:.6s}.giftText{font-weight:950;font-size:18px;line-height:1.15}.giftHint{font-size:13px;opacity:.55;font-weight:800;margin-top:4px}
.giftStage{width:min(610px,100%);min-height:430px;display:grid;place-items:center;position:relative}.box{width:150px;height:115px;background:#f26b86;border:4px solid #302b35;border-radius:10px;position:relative;box-shadow:0 12px 0 #c94d69;animation:boxBounce 1.5s infinite}.box:before{content:"";position:absolute;left:58px;top:-4px;width:30px;height:115px;background:#ffd65d;border-left:3px solid #302b35;border-right:3px solid #302b35}.lid{position:absolute;left:-9px;top:-27px;width:160px;height:35px;background:#ff8198;border:4px solid #302b35;border-radius:10px;transform-origin:15% 100%;animation:lidOpen 1.5s forwards}.burst{position:absolute;inset:0;pointer-events:none}.item{position:absolute;font-size:42px;opacity:0;animation:burst 1.2s .8s forwards}.i1{left:18%;top:25%}.i2{right:17%;top:23%;animation-delay:.9s}.i3{left:26%;bottom:22%;animation-delay:1s}.i4{right:25%;bottom:20%;animation-delay:1.1s}.stars{position:absolute;inset:0;pointer-events:none}.star{position:absolute;font-size:22px;animation:twinkle 1.3s infinite}.star:nth-child(1){left:18%;top:16%}.star:nth-child(2){right:19%;top:17%;animation-delay:.3s}.star:nth-child(3){left:12%;bottom:18%;animation-delay:.6s}.star:nth-child(4){right:12%;bottom:16%;animation-delay:.9s}
.danceFrame{width:min(360px,88vw);height:500px;border:4px solid #302b35;border-radius:26px;overflow:hidden;background:#d8d4bd;box-shadow:0 9px 0 #d2a5b8}.danceFrame video{width:100%;height:100%;object-fit:cover;display:block}.sorryPop{font-size:clamp(52px,14vw,110px);font-weight:1000;letter-spacing:5px;animation:pop .7s cubic-bezier(.2,1.7,.35,1) forwards;text-align:center}.gift3Text{width:100%;max-height:430px;overflow:auto;background:#fff0f5;border:3px solid #e4a7bb;border-radius:22px;padding:18px;font-size:17px;font-weight:800;line-height:1.48;white-space:pre-line}.choices{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%;margin-top:15px}.choice{min-height:90px;font-size:17px}.choice{position:relative;z-index:5;touch-action:manipulation}.finalGiftReveal{width:min(430px,92vw);margin-top:18px;border:4px solid #302b35;border-radius:24px;overflow:hidden;box-shadow:0 10px 0 #d7a8ba;background:white}.finalGiftReveal img{display:block;width:100%;height:auto;max-height:430px;object-fit:cover}
.finalMsg{text-align:center;font-size:24px;font-weight:950;line-height:1.3}.meterFinal{width:min(540px,100%);margin-top:20px}.starButton{width:110px;height:110px;border-radius:50%;border:4px solid #302b35;background:#ffd65d;font-size:52px;cursor:pointer;box-shadow:0 8px 0 #caa34a;transition:.15s}.starButton:active{transform:translateY(6px);box-shadow:0 2px 0 #caa34a}.meterFinal .meterFill{height:26px}
.svgDoodle{width:300px;height:220px;animation:bob 1.5s ease-in-out infinite}.tears{animation:tearDrop .9s ease-in-out infinite}.happyDoodle{animation:happyBob .8s ease-in-out infinite}@keyframes tearDrop{50%{transform:translateY(8px);opacity:.65}}@keyframes happyBob{50%{transform:translateY(-10px) rotate(2deg)}}
.realGift{width:min(620px,100%);height:430px;position:relative;display:grid;place-items:center;overflow:hidden;border-radius:26px;background:#241b1f}.realGift .scene{width:100%;height:100%;object-fit:cover;filter:saturate(1.05);}.realItem{position:absolute;opacity:0;width:100px;height:100px;object-fit:cover;border:3px solid white;border-radius:18px;box-shadow:0 10px 24px rgba(0,0,0,.28);animation:realBurst 1.4s .55s forwards}.r1{left:38%;top:45%;}.r2{left:42%;top:46%;animation-delay:.7s}.r3{left:43%;top:47%;animation-delay:.85s}.r4{left:44%;top:46%;animation-delay:1s}@keyframes realBurst{0%{opacity:0;transform:translate(0,30px) scale(.3) rotate(0)}20%{opacity:1}100%{opacity:1;transform:translate(var(--rx),var(--ry)) scale(1) rotate(var(--rr))}}
.r1{--rx:-170px;--ry:-120px;--rr:-16deg}.r2{--rx:165px;--ry:-115px;--rr:15deg}.r3{--rx:-155px;--ry:120px;--rr:12deg}.r4{--rx:160px;--ry:115px;--rr:-12deg}
.toast{position:fixed;left:50%;bottom:18px;transform:translate(-50%,20px);background:#302b35;color:#fff;padding:11px 18px;border-radius:18px;font-weight:900;opacity:0;pointer-events:none;transition:.3s;z-index:20}.toast.show{opacity:1;transform:translate(-50%,0)}
@keyframes float{50%{transform:translateY(-12px) rotate(8deg)}}@keyframes bob{50%{transform:translateY(-8px) rotate(1deg)}}@keyframes waveArm{50%{transform:rotate(-18deg)}}@keyframes pulse{50%{transform:scale(1.14)}}@keyframes giftFloat{50%{transform:translateY(-6px) rotate(-3deg)}}@keyframes boxBounce{50%{transform:translateY(-5px)}}@keyframes lidOpen{0%{transform:rotate(0)}100%{transform:rotate(-18deg) translate(-4px,-8px)}}@keyframes burst{0%{opacity:0;transform:translate(0,40px) scale(.4) rotate(0)}70%{opacity:1}100%{opacity:1;transform:translate(var(--dx,0),var(--dy,-100px)) scale(1) rotate(18deg)}}.i1{--dx:-80px;--dy:-80px}.i2{--dx:85px;--dy:-90px}.i3{--dx:-65px;--dy:65px}.i4{--dx:70px;--dy:60px}@keyframes twinkle{50%{transform:scale(1.4) rotate(20deg);opacity:.8}}@keyframes pop{0%{transform:scale(.1) rotate(-8deg);opacity:0}100%{transform:scale(1) rotate(0);opacity:1}}
@media(max-width:520px){.panel{min-height:calc(100vh - 40px);padding:28px 15px;border-radius:28px}.message{min-height:130px}.choices{grid-template-columns:1fr}.danceFrame{height:430px}.back{font-size:13px;padding:7px 10px}.doodleWrap{height:205px}.doodle{width:280px}}
</style>
</head>
<body>
<div class="bgstar s1">✦</div><div class="bgstar s2">✧</div><div class="bgstar s3">✦</div><div class="bgstar s4">✧</div>
<div id="app" class="app"></div><div id="toast" class="toast"></div>
<script>
const A='/';
const messages=[
`Plzz maaf kr dijiye yrrr I'm sorry sach me sorry huu 😭🤌🏻🤌🏻`,
`Plzzz nah maf kr dijiye me sorry bol toh rha hu  I'm Sorryyyyyyyyyyyyyyyyyyyyy 😭😔`,
`Mujhe pta hai aap gussa hai prr plzzzz 🤌🏻🤌🏻🤌🏻`,
`Dekhiye ye bhi bda hote jaa rha ye bhi chahta hai maaf kr de aap 👀😿`,
`No mat dabaiye nah plzzz 🙂`,
`Just yes dba dijiye plzzz plzzzzzzzzz🥺🙍🏻`,
`Mujhe pta tha 🤌🏻👀👀👀`
];
const doodles=[1,2,3,4,5,6,7];
let page='intro', msg=0, yesScale=1, meterTimer=null, finalPct=0;
const app=document.getElementById('app');
function back(){
 if(page==='intro')return;
 if(page==='anger'){page='intro';}
 else if(page==='message'){ if(msg===0) page='anger'; else msg--; }
 else if(page==='gifts'){page='message';msg=6;}
 else if(page==='gift1'||page==='gift2'||page==='gift3'){page='gifts';}
 else if(page==='final'){page='gift3';}
 render();
}
function shell(inner,backBtn=true){return `<div class="screen"><div class="panel">${backBtn?'<button class="back" onclick="back()">← Back</button>':''}${inner}</div></div>`}
function render(){
 clearTimeout(meterTimer);app.innerHTML='';
 if(page==='intro')renderIntro();
 if(page==='anger')renderAnger();
 if(page==='message')renderMessage();
 if(page==='gifts')renderGifts();
 if(page==='gift1')renderGift1();
 if(page==='gift2')renderGift2();
 if(page==='gift3')renderGift3();
 if(page==='final')renderFinal();
}
function renderIntro(){
 app.innerHTML=shell(`<div class="brand">AlinajiPlease</div><div class="waveDoodle"><div class="head"><i class="eye e1"></i><i class="eye e2"></i><i class="mouth"></i></div><div class="body"></div><div class="arm a1"></div><div class="arm a2"></div><div class="leg l1"></div><div class="leg l2"></div></div><div class="introText">Hiii Miss.Alina sheikh<br>kese hai aap<br>khana kha liye aap ??</div><div class="introSub">Bas ek chhoti si baat hai… pehle ye check karne do 👀</div><button class="btn green" onclick="goAnger()">Aage dekhiye ✦</button>` ,false);
}
function goAnger(){page='anger';render();}
function renderAnger(){
 app.innerHTML=shell(`<div class="meterTitle">Gussa Check</div><div class="meterSub">gussa check kr rha hu ek sec. 😭</div><div class="meterTick">📏</div><div class="meterBox"><div id="angerFill" class="meterFill"></div></div><div id="angerPct" class="meterPercent">0%</div><div id="angerStatus" class="meterStatus">checking…</div><button id="angerNext" class="btn green next" onclick="goMessage()">Ab dekhiye ✦</button>`);
 setTimeout(()=>{document.getElementById('angerFill').style.width='100%';let n=0;const iv=setInterval(()=>{n+=5;document.getElementById('angerPct').textContent=n+'%';if(n>=100){clearInterval(iv);document.getElementById('angerStatus').textContent='Result: thoda gussa hai 😭';document.getElementById('angerNext').classList.add('ready')}},120)},150);
}
function goMessage(){page='message';msg=0;render();}
function renderMessage(){
 const hideNo=msg>=5;
 const doodleSVG=[
`<svg class="svgDoodle" viewBox="0 0 300 220" aria-label="crying doodle"><g stroke="#302b35" stroke-width="7" stroke-linecap="round" fill="white"><circle cx="150" cy="85" r="55"/><path d="M105 145 Q150 175 195 145 L195 190 Q150 210 105 190Z"/><path d="M100 150L45 175"/><path d="M200 150L255 175"/></g><g fill="#302b35"><circle cx="130" cy="78" r="7"/><circle cx="170" cy="78" r="7"/></g><path d="M132 108 Q150 95 168 108" fill="none" stroke="#302b35" stroke-width="7" stroke-linecap="round"/><g class="tears" fill="#5bbcff"><ellipse cx="126" cy="93" rx="6" ry="11"/><ellipse cx="174" cy="93" rx="6" ry="11"/></g></svg>`,
`<svg class="svgDoodle" viewBox="0 0 300 220" aria-label="pleading doodle"><g stroke="#302b35" stroke-width="7" stroke-linecap="round" fill="white"><circle cx="150" cy="82" r="55"/><path d="M105 143 Q150 170 195 143 L195 190 Q150 207 105 190Z"/><path d="M108 150L55 125"/><path d="M192 150L245 125"/></g><g fill="#302b35"><circle cx="130" cy="76" r="7"/><circle cx="170" cy="76" r="7"/></g><path d="M132 108 Q150 116 168 108" fill="none" stroke="#302b35" stroke-width="7" stroke-linecap="round"/><text x="150" y="48" text-anchor="middle" font-size="28">🥺</text></svg>`,
`<svg class="svgDoodle" viewBox="0 0 300 220" aria-label="sorry doodle"><g stroke="#302b35" stroke-width="7" stroke-linecap="round" fill="white"><circle cx="150" cy="78" r="54"/><path d="M108 140 Q150 170 192 140 L192 190 Q150 208 108 190Z"/><path d="M110 145L55 170"/><path d="M190 145L245 170"/></g><g fill="#302b35"><circle cx="130" cy="72" r="7"/><circle cx="170" cy="72" r="7"/></g><path d="M135 105 Q150 112 165 105" fill="none" stroke="#302b35" stroke-width="7"/><text x="150" y="50" text-anchor="middle" font-size="27">😿</text></svg>`,
`<svg class="svgDoodle" viewBox="0 0 300 220" aria-label="waiting doodle"><g stroke="#302b35" stroke-width="7" stroke-linecap="round" fill="white"><circle cx="150" cy="78" r="54"/><path d="M108 140 Q150 168 192 140 L192 190 Q150 208 108 190Z"/><path d="M108 150L45 150"/><path d="M192 150L255 150"/></g><g fill="#302b35"><circle cx="130" cy="72" r="7"/><circle cx="170" cy="72" r="7"/></g><path d="M135 105 Q150 112 165 105" fill="none" stroke="#302b35" stroke-width="7"/><circle cx="150" cy="160" r="20" fill="none" stroke="#ef5368" stroke-width="6"/><path d="M150 160L150 147M150 160L161 166" stroke="#ef5368" stroke-width="5"/></svg>`,
`<svg class="svgDoodle" viewBox="0 0 300 220" aria-label="no please doodle"><g stroke="#302b35" stroke-width="7" stroke-linecap="round" fill="white"><circle cx="150" cy="82" r="55"/><path d="M106 143 Q150 172 194 143 L194 190 Q150 208 106 190Z"/><path d="M106 148L55 120"/><path d="M194 148L245 120"/></g><g fill="#302b35"><circle cx="130" cy="76" r="7"/><circle cx="170" cy="76" r="7"/></g><path d="M132 108 Q150 98 168 108" fill="none" stroke="#302b35" stroke-width="7"/><text x="150" y="47" text-anchor="middle" font-size="26">✦</text></svg>`,
`<svg class="svgDoodle" viewBox="0 0 300 220" aria-label="hopeful doodle"><g stroke="#302b35" stroke-width="7" stroke-linecap="round" fill="white"><circle cx="150" cy="80" r="55"/><path d="M108 143 Q150 170 192 143 L192 190 Q150 208 108 190Z"/><path d="M110 150L65 105"/><path d="M190 150L235 105"/></g><g fill="#302b35"><circle cx="130" cy="75" r="7"/><circle cx="170" cy="75" r="7"/></g><path d="M132 104 Q150 116 168 104" fill="none" stroke="#302b35" stroke-width="7"/><text x="150" y="46" text-anchor="middle" font-size="27">⭐</text></svg>`,
`<svg class="svgDoodle happyDoodle" viewBox="0 0 300 220" aria-label="happy doodle"><g stroke="#302b35" stroke-width="7" stroke-linecap="round" fill="white"><circle cx="150" cy="82" r="55"/><path d="M106 143 Q150 172 194 143 L194 190 Q150 208 106 190Z"/><path d="M105 150L45 115"/><path d="M195 150L255 115"/></g><g fill="#302b35"><circle cx="130" cy="75" r="7"/><circle cx="170" cy="75" r="7"/></g><path d="M128 100 Q150 122 172 100" fill="none" stroke="#302b35" stroke-width="7"/><text x="150" y="43" text-anchor="middle" font-size="29">✦</text></svg>`
];
const doodle=doodleSVG[msg];
 const yesSize=Math.min(1+(.24*Math.max(0,yesScale-1)),3.1);
 app.innerHTML=shell(`<div class="small">Page ${msg+1} / 7</div><div class="doodleWrap">${doodle}<div class="doodleLabel">animated doodle ✦</div></div><div class="message">${messages[msg]}</div><div class="actions"><button id="yesBtn" class="btn yes" style="transform:scale(${yesSize})" onclick="yesClick()">YES</button>${hideNo?'':`<button id="noBtn" class="btn no" onclick="noClick()">NO</button>`}</div><div class="progressDots">${messages.map((_,i)=>`<span class="dot ${i===msg?'on':''}"></span>`).join('')}</div>`);
}
function noClick(){if(msg>=5)return;yesScale+=.32;msg++;render();}
function yesClick(){
 if(msg<5){const b=document.getElementById('yesBtn');b.textContent='NO';b.classList.remove('yes');b.classList.add('redbtn','dead');b.onclick=null;return;}
 if(msg===5){msg=6;render();return;}
 if(msg===6){page='gifts';render();}
}
function renderGifts(){
 app.innerHTML=shell(`<div class="giftsTitle">Aapke liye 3 chhoti si cheezein ✦</div><div class="giftsSub">Ek-ek karke kholiye… jaldi nahi 😭</div><div class="giftGrid"><button class="giftCard" onclick="page='gift1';render()"><span class="giftIcon">🎁</span><span><div class="giftText">Plzz open toh kriye isse open meeeeeeee 🤌🏻🤌🏻🤌🏻</div><div class="giftHint">pehle wala gift ✦</div></span></button><button class="giftCard" onclick="page='gift2';render()"><span class="giftIcon">🎁</span><span><div class="giftText">mujhe bhi kholiye plzzzzzzz 🙇🏻</div><div class="giftHint">isme thoda pagalpan hai 😂</div></span></button><button class="giftCard" onclick="page='gift3';render()"><span class="giftIcon">🎁</span><span><div class="giftText">Accha ji ab ye last wala kholiye 😿🤌🏻</div><div class="giftHint">last mein ek baat hai… ⭐</div></span></button></div>`);
}
function renderGift1(){
 app.innerHTML=shell(`<div class="giftsTitle">Gift 1 ✦</div><div class="realGift"><img class="scene" src="gift_scene.png" alt="realistic roses and gifts"><img class="realItem r1" src="roses.jpg" alt="red roses"><img class="realItem r2" src="chocolates.jpg" alt="chocolates"><img class="realItem r3" src="kurkure.jpg" alt="Kurkure"><img class="realItem r4" src="icecream.jpg" alt="ice cream"></div><div class="finalMsg">Bht saare red roses + chocolates + Kurkure + ice cream ✦</div><button class="btn pinkbtn" onclick="page='gifts';render()">Gifts par wapas</button>`);
}

function choice(text,final=false){toast(text);if(final){setTimeout(()=>{page='final';render()},1200)}}
function renderFinal(){
 const done=finalPct>=100;
 app.innerHTML=shell(`<div class="meterTitle">Maafi Meter</div><div class="meterSub">Star tap karke meter pura kijiye ⭐</div><div class="meterFinal"><div class="meterBox"><div id="finalFill" class="meterFill" style="width:${finalPct}%"></div></div><div id="finalPct" class="meterPercent">${finalPct}%</div><div id="finalStatus" class="meterStatus">${done?'Maaf Kiya ⭐':'Maafi pending…'}</div></div>${done?`<div class="finalGiftReveal"><img src="final_gift.jpg" alt="final gift"></div><div class="finalMsg">Maaf Kiya ⭐</div>`:`<button type="button" class="starButton" onclick="addForgiveness()">⭐</button>`}`);

function addForgiveness(){if(finalPct<100)finalPct=Math.min(100,finalPct+10);renderFinal();if(finalPct===100)toast('MAAF KIYA ⭐😭');}
function toast(t){const el=document.getElementById('toast');el.textContent=t;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),1700)}
// Password gate
function gate(){
 app.innerHTML=`<div class="screen"><div class="panel"><div class="brand">AlinajiPlease</div><div class="introText" style="font-size:27px">Please shant ho jaiye</div><div style="display:flex;gap:10px;width:min(560px,100%);align-items:center"><div style="position:relative;flex:1"><input id="pw" type="password" placeholder="Password" style="width:100%;height:62px;border:4px solid #302b35;border-radius:20px;padding:0 58px 0 18px;font-size:22px;font-weight:900;outline:none"><button id="eye" style="position:absolute;right:8px;top:7px;width:48px;height:48px;border:0;background:transparent;font-size:25px;cursor:pointer">👁️</button></div><button id="open" class="btn green" style="height:62px">Open</button></div><div class="small" style="margin-top:15px">Password yaad hai na? 👀</div></div></div>`;
 const pw=document.getElementById('pw');
 document.getElementById('eye').onclick=()=>pw.type=pw.type==='password'?'text':'password';
 document.getElementById('open').onclick=()=>{
   if(pw.value==='Sorry'){page='intro';render()}
   else{pw.animate([{transform:'translateX(-8px)'},{transform:'translateX(8px)'},{transform:'translateX(0)'}],{duration:220});}
 };
}
gate();
